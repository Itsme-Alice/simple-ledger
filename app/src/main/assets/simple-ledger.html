<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0ea5e9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>极简记账</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "recharts": "https://esm.sh/recharts@2.12.7",
      "htm": "https://esm.sh/htm@3.1.1"
    }
  }
  </script>
  <style>
    html { -webkit-tap-highlight-color: transparent; }
    body { overscroll-behavior-y: none; }
    .safe-area-pb { padding-bottom: env(safe-area-inset-bottom, 0px); }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0ea5e9',
            expense: '#ef4444',
            income: '#22c55e',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900">
  <div id="root"></div>
  <script type="module">
    import React, { useState, useEffect, useMemo, useCallback } from 'react';
    import { createRoot } from 'react-dom/client';
    import { PieChart, Pie, Cell, ResponsiveContainer, Tooltip, LineChart, Line, XAxis, YAxis, CartesianGrid } from 'recharts';
    import htm from 'htm';
    const html = htm.bind(React.createElement);

    /* ========== IndexedDB ========== */
    const DB_NAME = 'SimpleLedgerDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'transactions';
    let db = null;

    function openDB() {
      return new Promise((resolve, reject) => {
        if (db) return resolve(db);
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => { db = request.result; resolve(db); };
        request.onupgradeneeded = (event) => {
          const database = event.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            const store = database.createObjectStore(STORE_NAME, { keyPath: 'id' });
            store.createIndex('date', 'date', { unique: false });
            store.createIndex('month', 'month', { unique: false });
            store.createIndex('scene', 'scene', { unique: false });
            store.createIndex('category', 'category', { unique: false });
          }
        };
      });
    }
    function getStore(mode = 'readonly') {
      const transaction = db.transaction(STORE_NAME, mode);
      return transaction.objectStore(STORE_NAME);
    }
    async function addTransaction(tx) {
      await openDB();
      return new Promise((resolve, reject) => {
        const store = getStore('readwrite');
        const request = store.put(tx);
        request.onsuccess = () => resolve(tx);
        request.onerror = () => reject(request.error);
      });
    }
    async function deleteTransaction(id) {
      await openDB();
      return new Promise((resolve, reject) => {
        const store = getStore('readwrite');
        const request = store.delete(id);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }
    async function getAllTransactions() {
      await openDB();
      return new Promise((resolve, reject) => {
        const store = getStore();
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result.sort((a, b) => b.createdAt - a.createdAt));
        request.onerror = () => reject(request.error);
      });
    }
    async function getTransactionsByMonth(month) {
      await openDB();
      return new Promise((resolve, reject) => {
        const store = getStore();
        const index = store.index('month');
        const request = index.getAll(month);
        request.onsuccess = () => resolve(request.result.sort((a, b) => b.createdAt - a.createdAt));
        request.onerror = () => reject(request.error);
      });
    }
    async function getTransactionsByScene(scene) {
      await openDB();
      return new Promise((resolve, reject) => {
        const store = getStore();
        const index = store.index('scene');
        const request = index.getAll(scene);
        request.onsuccess = () => resolve(request.result.sort((a, b) => b.createdAt - a.createdAt));
        request.onerror = () => reject(request.error);
      });
    }
    async function searchTransactions(keyword) {
      const all = await getAllTransactions();
      const lower = keyword.toLowerCase();
      return all.filter(tx =>
        (tx.note && tx.note.toLowerCase().includes(lower)) ||
        (tx.category && tx.category.toLowerCase().includes(lower)) ||
        (tx.scene && tx.scene.toLowerCase().includes(lower))
      );
    }
    async function exportToCSV() {
      const all = await getAllTransactions();
      const headers = ['date','type','amount','category','scene','note','paymentMethod'];
      const rows = all.map(tx => [tx.date, tx.type, tx.amount, tx.category, tx.scene, tx.note || '', tx.paymentMethod || '']);
      return [headers.join(','), ...rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(','))].join('\n');
    }
    async function exportToJSON() {
      const all = await getAllTransactions();
      return JSON.stringify({ app: 'SimpleLedger', version: '1.0.0', exportedAt: Date.now(), transactions: all }, null, 2);
    }

    const DEFAULT_CATEGORIES = ['餐饮','交通','购物','娱乐','住房','医疗','学习','其他'];
    const DEFAULT_SCENES = ['日常','家庭','工作','旅行','项目'];
    const COLORS = ['#0ea5e9','#f59e0b','#ef4444','#22c55e','#8b5cf6','#ec4899','#14b8a6','#64748b'];

    /* ========== Utils ========== */
    function generateId() { return 'tx_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6); }
    function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function getMonthStr(dateStr) { return dateStr.slice(0, 7); }
    function downloadFile(content, filename, mime) { const blob = new Blob([content], {type: mime}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; a.click(); URL.revokeObjectURL(url); }

    /* ========== BottomNav ========== */
    function BottomNav({ current, onChange }) {
      const tabs = [
        { key: 'add', label: '记一笔', icon: '+' },
        { key: 'month', label: '月账单', icon: '📅' },
        { key: 'scene', label: '场景', icon: '🏷️' },
        { key: 'stats', label: '统计', icon: '📊' },
      ];
      return html`
        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 z-50 safe-area-pb">
          <div class="max-w-md mx-auto flex justify-around items-center h-16">
            ${tabs.map(tab => html`
              <button key=${tab.key} onClick=${() => onChange(tab.key)} class="flex flex-col items-center gap-0.5 text-xs ${current === tab.key ? 'text-primary' : 'text-gray-400'}">
                <span class="text-lg">${tab.icon}</span>
                <span>${tab.label}</span>
              </button>
            `)}
          </div>
        </nav>
      `;
    }

    /* ========== AddPage ========== */
    function AddPage({ onSaved }) {
      const [amount, setAmount] = useState('');
      const [type, setType] = useState('expense');
      const [category, setCategory] = useState(DEFAULT_CATEGORIES[0]);
      const [scene, setScene] = useState(DEFAULT_SCENES[0]);
      const [date, setDate] = useState(todayStr);
      const [note, setNote] = useState('');
      const [paymentMethod, setPaymentMethod] = useState('微信');

      const reset = () => { setAmount(''); setType('expense'); setCategory(DEFAULT_CATEGORIES[0]); setScene(DEFAULT_SCENES[0]); setDate(todayStr); setNote(''); };
      const handleSave = async () => {
        const num = parseFloat(amount);
        if (!num || num <= 0) return;
        await addTransaction({ id: generateId(), amount: num, type, category, scene, date, month: getMonthStr(date), note, paymentMethod, createdAt: Date.now() });
        reset(); onSaved();
      };
      const appendNum = (n) => {
        if (n === '.' && amount.includes('.')) return;
        if (amount.includes('.') && amount.split('.')[1]?.length >= 2) return;
        setAmount(prev => prev + n);
      };
      const backspace = () => setAmount(prev => prev.slice(0, -1));

      return html`
        <div class="pb-20 pt-2 px-3 max-w-md mx-auto min-h-screen">
          <h1 class="text-base font-bold text-center mb-2">记一笔</h1>

          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 px-4 py-3 mb-2">
            <div class="flex items-center justify-between mb-2">
              <div class="flex gap-2">
                <button onClick=${() => setType('expense')} class="px-3 py-1 rounded-full text-sm font-medium ${type === 'expense' ? 'bg-expense text-white' : 'bg-gray-100 text-gray-500'}">支出</button>
                <button onClick=${() => setType('income')} class="px-3 py-1 rounded-full text-sm font-medium ${type === 'income' ? 'bg-income text-white' : 'bg-gray-100 text-gray-500'}">收入</button>
              </div>
              <span class="text-gray-400 text-xs">${paymentMethod}</span>
            </div>
            <div class="text-right text-4xl font-bold text-gray-900 py-1">
              <span class="text-2xl text-gray-400 mr-1">¥</span>${amount || '0'}
            </div>
          </div>

          <div class="mb-2">
            <label class="text-xs text-gray-400 mb-1 block">分类</label>
            <div class="flex flex-wrap gap-1.5">
              ${DEFAULT_CATEGORIES.map(c => html`
                <button key=${c} onClick=${() => setCategory(c)} class="px-2.5 py-1 rounded-lg text-xs ${category === c ? 'bg-primary text-white' : 'bg-white text-gray-600 border border-gray-100'}">${c}</button>
              `)}
            </div>
          </div>

          <div class="mb-2">
            <label class="text-xs text-gray-400 mb-1 block">场景</label>
            <div class="flex flex-wrap gap-1.5">
              ${DEFAULT_SCENES.map(s => html`
                <button key=${s} onClick=${() => setScene(s)} class="px-2.5 py-1 rounded-lg text-xs ${scene === s ? 'bg-primary text-white' : 'bg-white text-gray-600 border border-gray-100'}">${s}</button>
              `)}
            </div>
          </div>

          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 px-4 py-3 mb-2 space-y-3">
            <div class="flex items-center justify-between py-1">
              <span class="text-sm text-gray-500">日期</span>
              <input type="date" value=${date} onChange=${e => setDate(e.target.value)} class="text-right text-sm bg-transparent outline-none" />
            </div>
            <div class="flex items-center justify-between py-1">
              <span class="text-sm text-gray-500">备注</span>
              <input type="text" value=${note} onChange=${e => setNote(e.target.value)} placeholder="选填" class="text-right text-sm bg-transparent outline-none flex-1 ml-4" />
            </div>
            <div class="flex items-center justify-between py-1">
              <span class="text-sm text-gray-500">支付方式</span>
              <select value=${paymentMethod} onChange=${e => setPaymentMethod(e.target.value)} class="text-right text-sm bg-transparent outline-none">
                <option>微信</option><option>支付宝</option><option>现金</option><option>信用卡</option><option>其他</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-4 gap-1.5 mb-2">
            ${['1','2','3'].map(k => html`<button key=${k} onClick=${() => appendNum(k)} class="bg-white rounded-xl py-2.5 text-base font-medium shadow-sm active:bg-gray-50">${k}</button>`)}
            <button onClick=${backspace} class="bg-white rounded-xl py-2.5 text-base font-medium shadow-sm active:bg-gray-50">←</button>
            ${['4','5','6'].map(k => html`<button key=${k} onClick=${() => appendNum(k)} class="bg-white rounded-xl py-2.5 text-base font-medium shadow-sm active:bg-gray-50">${k}</button>`)}
            <button onClick=${reset} class="bg-white rounded-xl py-2.5 text-base font-medium shadow-sm active:bg-gray-50 text-gray-400">C</button>
            ${['7','8','9'].map(k => html`<button key=${k} onClick=${() => appendNum(k)} class="bg-white rounded-xl py-2.5 text-base font-medium shadow-sm active:bg-gray-50">${k}</button>`)}
            <button onClick=${() => appendNum('.')} class="bg-white rounded-xl py-2.5 text-base font-medium shadow-sm active:bg-gray-50">.</button>
            <button onClick=${handleSave} class="col-span-2 bg-primary text-white rounded-xl py-2.5 text-base font-medium shadow-sm active:scale-95 transition-transform">保存</button>
            <button onClick=${() => appendNum('0')} class="bg-white rounded-xl py-2.5 text-base font-medium shadow-sm active:bg-gray-50">0</button>
            <button onClick=${() => { if (amount) setAmount(amount + '00'); }} class="bg-white rounded-xl py-2.5 text-base font-medium shadow-sm active:bg-gray-50">00</button>
          </div>
        </div>
      `;
    }

    /* ========== MonthPage ========== */
    function MonthPage() {
      const [currentMonth, setCurrentMonth] = useState(() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; });
      const [transactions, setTransactions] = useState([]);

      useEffect(() => {
        let mounted = true;
        (async () => {
          const txs = await getTransactionsByMonth(currentMonth);
          if (mounted) setTransactions(txs);
        })();
        return () => { mounted = false; };
      }, [currentMonth]);

      const shiftMonth = (delta) => {
        const [y, m] = currentMonth.split('-').map(Number);
        const d = new Date(y, m - 1 + delta, 1);
        setCurrentMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
      };

      const expenseTotal = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
      const incomeTotal = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
      const balance = incomeTotal - expenseTotal;

      const categoryData = {};
      transactions.filter(t => t.type === 'expense').forEach(t => { categoryData[t.category] = (categoryData[t.category] || 0) + t.amount; });
      const pieData = Object.entries(categoryData).map(([name, value]) => ({ name, value }));

      const handleDelete = async (id) => {
        if (!confirm('确定删除这条记录？')) return;
        await deleteTransaction(id);
        setTransactions(await getTransactionsByMonth(currentMonth));
      };

      return html`
        <div class="pb-20 pt-4 px-4 max-w-md mx-auto min-h-screen">
          <h1 class="text-xl font-bold text-center mb-4">月账单</h1>

          <div class="flex items-center justify-between mb-4">
            <button onClick=${() => shiftMonth(-1)} class="p-2 rounded-full bg-white shadow-sm text-lg">←</button>
            <span class="text-lg font-semibold">${currentMonth}</span>
            <button onClick=${() => shiftMonth(1)} class="p-2 rounded-full bg-white shadow-sm text-lg">→</button>
          </div>

          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4">
            <div class="grid grid-cols-3 gap-4 text-center">
              <div><div class="text-xs text-gray-400 mb-1">支出</div><div class="text-lg font-bold text-expense">¥${expenseTotal.toFixed(2)}</div></div>
              <div><div class="text-xs text-gray-400 mb-1">收入</div><div class="text-lg font-bold text-income">¥${incomeTotal.toFixed(2)}</div></div>
              <div><div class="text-xs text-gray-400 mb-1">结余</div><div class="text-lg font-bold ${balance >= 0 ? 'text-income' : 'text-expense'}">¥${balance.toFixed(2)}</div></div>
            </div>
          </div>

          ${pieData.length > 0 ? html`
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4">
              <div class="text-sm font-medium text-gray-500 mb-2">分类支出</div>
              <${ResponsiveContainer} width="100%" height=${220}>
                <${PieChart}>
                  <${Pie} data=${pieData} cx="50%" cy="50%" innerRadius=${50} outerRadius=${80} dataKey="value" stroke="none">
                    ${pieData.map((entry, index) => html`<${Cell} key=${index} fill=${COLORS[index % COLORS.length]} />`)}
                  <//Pie>
                  <${Tooltip} formatter=${value => `¥${value.toFixed(2)}`} />
                <//PieChart>
              <//ResponsiveContainer>
              <div class="flex flex-wrap gap-2 justify-center mt-2">
                ${pieData.map((entry, index) => html`
                  <div key=${entry.name} class="flex items-center gap-1 text-xs">
                    <span class="w-2.5 h-2.5 rounded-full" style=${{backgroundColor: COLORS[index % COLORS.length]}}></span>${entry.name}
                  </div>
                `)}
              </div>
            </div>
          ` : null}

          <div class="space-y-2">
            <div class="text-sm font-medium text-gray-500">明细</div>
            ${transactions.length === 0 ? html`<div class="text-center text-gray-300 py-8">本月暂无记录</div>` : null}
            ${transactions.map(tx => html`
              <div key=${tx.id} class="bg-white rounded-2xl shadow-sm border border-gray-100 p-3 flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-full flex items-center justify-center text-white text-sm font-medium ${tx.type === 'expense' ? 'bg-expense' : 'bg-income'}">${tx.category[0]}</div>
                  <div>
                    <div class="text-sm font-medium">${tx.category}<span class="text-xs text-gray-400 ml-1">· ${tx.scene}</span></div>
                    <div class="text-xs text-gray-400">${tx.date} ${tx.note}</div>
                  </div>
                </div>
                <div class="flex items-center gap-3">
                  <span class="font-semibold ${tx.type === 'expense' ? 'text-expense' : 'text-income'}">${tx.type === 'expense' ? '-' : '+'}¥${tx.amount.toFixed(2)}</span>
                  <button onClick=${() => handleDelete(tx.id)} class="text-xs text-gray-300 hover:text-expense">删除</button>
                </div>
              </div>
            `)}
          </div>
        </div>
      `;
    }

    /* ========== ScenePage ========== */
    function ScenePage() {
      const [activeScene, setActiveScene] = useState(null);
      const [allTransactions, setAllTransactions] = useState([]);
      const [filterMonth, setFilterMonth] = useState('');

      useEffect(() => {
        let mounted = true;
        (async () => { const txs = await getAllTransactions(); if (mounted) setAllTransactions(txs); })();
        return () => { mounted = false; };
      }, []);

      if (activeScene) {
        const sceneTxs = allTransactions.filter(t => t.scene === activeScene && (!filterMonth || t.month === filterMonth));
        const expense = sceneTxs.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
        const income = sceneTxs.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
        const months = [...new Set(allTransactions.map(t => t.month))].sort().reverse();

        return html`
          <div class="pb-20 pt-4 px-4 max-w-md mx-auto min-h-screen">
            <div class="flex items-center gap-2 mb-4">
              <button onClick=${() => setActiveScene(null)} class="p-1 rounded-full hover:bg-gray-100 text-lg">←</button>
              <h1 class="text-xl font-bold">${activeScene}</h1>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4">
              <div class="grid grid-cols-2 gap-4 text-center">
                <div><div class="text-xs text-gray-400 mb-1">支出</div><div class="text-lg font-bold text-expense">¥${expense.toFixed(2)}</div></div>
                <div><div class="text-xs text-gray-400 mb-1">收入</div><div class="text-lg font-bold text-income">¥${income.toFixed(2)}</div></div>
              </div>
            </div>
            <div class="mb-4">
              <select value=${filterMonth} onChange=${e => setFilterMonth(e.target.value)} class="w-full p-3 rounded-xl border border-gray-100 bg-white text-sm outline-none">
                <option value="">全部月份</option>
                ${months.map(m => html`<option key=${m} value=${m}>${m}</option>`)}
              </select>
            </div>
            <div class="space-y-2">
              ${sceneTxs.length === 0 ? html`<div class="text-center text-gray-300 py-8">暂无记录</div>` : null}
              ${sceneTxs.map(tx => html`
                <div key=${tx.id} class="bg-white rounded-2xl shadow-sm border border-gray-100 p-3 flex items-center justify-between">
                  <div>
                    <div class="text-sm font-medium">${tx.category}<span class="text-xs text-gray-400 ml-1">· ${tx.date}</span></div>
                    ${tx.note ? html`<div class="text-xs text-gray-400">${tx.note}</div>` : null}
                  </div>
                  <span class="font-semibold ${tx.type === 'expense' ? 'text-expense' : 'text-income'}">${tx.type === 'expense' ? '-' : '+'}¥${tx.amount.toFixed(2)}</span>
                </div>
              `)}
            </div>
          </div>
        `;
      }

      return html`
        <div class="pb-20 pt-4 px-4 max-w-md mx-auto min-h-screen">
          <h1 class="text-xl font-bold text-center mb-4">场景</h1>
          <div class="grid grid-cols-2 gap-3">
            ${DEFAULT_SCENES.map(scene => {
              const sceneTxs = allTransactions.filter(t => t.scene === scene);
              const expense = sceneTxs.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
              return html`
                <button key=${scene} onClick=${() => setActiveScene(scene)} class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 text-left active:scale-[0.98] transition-transform">
                  <div class="text-base font-semibold mb-2">${scene}</div>
                  <div class="text-xs text-gray-400">${sceneTxs.length} 笔</div>
                  <div class="text-sm font-bold text-expense mt-1">¥${expense.toFixed(2)}</div>
                </button>
              `;
            })}
          </div>
        </div>
      `;
    }

    /* ========== StatsPage ========== */
    function StatsPage() {
      const [transactions, setTransactions] = useState([]);
      const [searchKeyword, setSearchKeyword] = useState('');
      const [searchResults, setSearchResults] = useState([]);

      useEffect(() => {
        let mounted = true;
        (async () => { const txs = await getAllTransactions(); if (mounted) setTransactions(txs); })();
        return () => { mounted = false; };
      }, []);

      const last6Months = useMemo(() => {
        const now = new Date();
        const arr = [];
        for (let i = 5; i >= 0; i--) {
          const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
          arr.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
        }
        return arr;
      }, []);

      const trendData = useMemo(() => {
        return last6Months.map(m => {
          const expense = transactions.filter(t => t.month === m && t.type === 'expense').reduce((s, t) => s + t.amount, 0);
          return { month: m.slice(5), expense: Math.round(expense * 100) / 100 };
        });
      }, [transactions, last6Months]);

      const categoryRank = useMemo(() => {
        const map = {};
        const currentMonth = `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;
        transactions.filter(t => t.month === currentMonth && t.type === 'expense').forEach(t => { map[t.category] = (map[t.category] || 0) + t.amount; });
        const total = Object.values(map).reduce((a, b) => a + b, 0);
        return Object.entries(map).map(([name, value]) => ({ name, value, percent: total ? Math.round((value / total) * 100) : 0 })).sort((a, b) => b.value - a.value);
      }, [transactions]);

      const avgDaily = useMemo(() => {
        const currentMonth = `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;
        const expense = transactions.filter(t => t.month === currentMonth && t.type === 'expense').reduce((s, t) => s + t.amount, 0);
        const day = Math.min(new Date().getDate(), new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate());
        return day > 0 ? expense / day : 0;
      }, [transactions]);

      const handleSearch = async () => {
        if (!searchKeyword.trim()) { setSearchResults([]); return; }
        setSearchResults(await searchTransactions(searchKeyword));
      };

      const handleExportCSV = async () => { downloadFile('\ufeff' + await exportToCSV(), `ledger_${new Date().toISOString().slice(0,10)}.csv`, 'text/csv;charset=utf-8;'); };
      const handleExportJSON = async () => { downloadFile(await exportToJSON(), `ledger_backup_${new Date().toISOString().slice(0,10)}.json`, 'application/json'); };

      const handleDelete = async (id) => {
        if (!confirm('确定删除这条记录？')) return;
        await deleteTransaction(id);
        const txs = await getAllTransactions();
        setTransactions(txs);
        if (searchKeyword) setSearchResults(await searchTransactions(searchKeyword));
      };

      return html`
        <div class="pb-20 pt-4 px-4 max-w-md mx-auto min-h-screen">
          <h1 class="text-xl font-bold text-center mb-4">统计</h1>

          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-3 mb-4">
            <div class="flex gap-2">
              <input type="text" value=${searchKeyword} onChange=${e => setSearchKeyword(e.target.value)} onKeyDown=${e => e.key === 'Enter' && handleSearch()} placeholder="搜索备注、分类、场景..." class="flex-1 bg-gray-50 rounded-lg px-3 py-2 text-sm outline-none" />
              <button onClick=${handleSearch} class="bg-primary text-white p-2 rounded-lg active:scale-95 text-sm">🔍</button>
            </div>
            ${searchResults.length > 0 ? html`
              <div class="mt-3 space-y-2 max-h-64 overflow-y-auto">
                <div class="text-xs text-gray-400">找到 ${searchResults.length} 条</div>
                ${searchResults.map(tx => html`
                  <div key=${tx.id} class="flex items-center justify-between bg-gray-50 rounded-lg p-2">
                    <div>
                      <div class="text-sm">${tx.category} · ${tx.scene}</div>
                      <div class="text-xs text-gray-400">${tx.date} ${tx.note}</div>
                    </div>
                    <div class="flex items-center gap-2">
                      <span class="text-sm font-semibold ${tx.type === 'expense' ? 'text-expense' : 'text-income'}">${tx.type === 'expense' ? '-' : '+'}¥${tx.amount.toFixed(2)}</span>
                      <button onClick=${() => handleDelete(tx.id)} class="text-xs text-gray-300 hover:text-expense">删</button>
                    </div>
                  </div>
                `)}
              </div>
            ` : null}
          </div>

          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4">
            <div class="text-sm font-medium text-gray-500 mb-2">近6个月支出趋势</div>
            ${trendData.some(d => d.expense > 0) ? html`
              <${ResponsiveContainer} width="100%" height=${200}>
                <${LineChart} data=${trendData}>
                  <${CartesianGrid} strokeDasharray="3 3" stroke="#f1f5f9" />
                  <${XAxis} dataKey="month" tick=${{fontSize: 12}} axisLine=${false} tickLine=${false} />
                  <${YAxis} tick=${{fontSize: 12}} axisLine=${false} tickLine=${false} width=${50} />
                  <${Tooltip} formatter=${value => `¥${value.toFixed(2)}`} />
                  <${Line} type="monotone" dataKey="expense" stroke="#0ea5e9" strokeWidth=${2} dot=${{r: 3}} />
                <//LineChart>
              <//ResponsiveContainer>
            ` : html`<div class="text-center text-gray-300 py-8">暂无数据</div>`}
          </div>

          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4">
            <div class="text-sm font-medium text-gray-500 mb-3">本月分类排行</div>
            ${categoryRank.length === 0 ? html`<div class="text-center text-gray-300 py-4">暂无数据</div>` : null}
            <div class="space-y-3">
              ${categoryRank.map((item, idx) => html`
                <div key=${item.name}>
                  <div class="flex justify-between text-sm mb-1">
                    <span class="font-medium">${idx + 1}. ${item.name}</span>
                    <span class="text-gray-500">¥${item.value.toFixed(2)} · ${item.percent}%</span>
                  </div>
                  <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
                    <div class="h-full bg-primary rounded-full" style=${{width: `${item.percent}%`}}></div>
                  </div>
                </div>
              `)}
            </div>
          </div>

          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4 text-center">
            <div class="text-xs text-gray-400 mb-1">本月平均每天消费</div>
            <div class="text-2xl font-bold text-expense">¥${avgDaily.toFixed(2)}</div>
          </div>

          <div class="grid grid-cols-2 gap-3 mb-8">
            <button onClick=${handleExportCSV} class="bg-white rounded-2xl shadow-sm border border-gray-100 p-3 flex items-center justify-center gap-2 text-sm font-medium active:scale-[0.98]">📊 导出 CSV</button>
            <button onClick=${handleExportJSON} class="bg-white rounded-2xl shadow-sm border border-gray-100 p-3 flex items-center justify-center gap-2 text-sm font-medium active:scale-[0.98]">📄 备份 JSON</button>
          </div>
        </div>
      `;
    }

    /* ========== App ========== */
    function App() {
      const [page, setPage] = useState('add');
      const [refreshKey, setRefreshKey] = useState(0);
      const refresh = useCallback(() => setRefreshKey(k => k + 1), []);

      const pages = {
        add: html`<${AddPage} onSaved=${refresh} />`,
        month: html`<${MonthPage} key=${refreshKey} />`,
        scene: html`<${ScenePage} key=${refreshKey} />`,
        stats: html`<${StatsPage} key=${refreshKey} />`,
      };

      return html`
        <div class="min-h-screen bg-gray-50">
          <main class="pb-20">${pages[page]}</main>
          <${BottomNav} current=${page} onChange=${setPage} />
        </div>
      `;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
